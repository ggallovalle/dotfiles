entries:
  # Shell configs: zsh/config/zsh/**/* → ~/.config/zsh/**
  - source: zsh/config/zsh
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "zsh"
    type: directory

  # Shell configs: fish/config/fish/**/* → ~/.config/fish/**
  - source: fish/config/fish
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "fish"
    type: directory

  # Bash
  - source: bash/config/bash/bashrc
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "bash"
      - "bashrc"
    type: file

  # Git
  - source: git/config/git
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "git"
    type: directory

  # Alacritty
  - source: alacritty/config/alacritty
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "alacritty"
    type: directory

  # AwesomeWM
  - source: awesome/config/awesome
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "awesome"
    type: directory

  - source: awesome/scripts
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "awesome"
      - "scripts"
    type: directory

  # Fontconfig
  - source: fontconfig/config/fontconfig
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "fontconfig"
    type: directory

  - source: fontconfig/scripts
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "fontconfig"
      - "scripts"
    type: directory

  # Glow
  - source: glow/config/glow
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "glow"
    type: directory

  # Mise
  - source: mise/config/mise
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "mise"
    type: directory

  # IDEAvim
  - source: ideavim/config/ideavim
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "ideavim"
    type: directory

  # Kitty
  - source: kitty/config/kitty
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "kitty"
    type: directory

  # LSD
  - source: lsd/config/lsd
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "lsd"
    type: directory

  # Maven
  - source: maven/config/maven
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "maven"
    type: directory

  # Nushell
  - source: nushell/config/nushell
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "nushell"
    type: directory

  # Picom
  - source: picom/config/picom
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "picom"
    type: directory

  # Starship
  - source: starship/config/starship
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "starship"
    type: directory

  # Wezterm
  - source: wezterm/config/wezterm
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "wezterm"
    type: directory

  # Zellij
  - source: zellij/config/zellij
    target:
      - "{{ env.XDG_CONFIG_HOME }}"
      - "zellij"
    type: directory
